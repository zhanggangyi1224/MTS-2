# MTS Data Pipeline Configuration

data:
  dataset_name: "ccmusic-database/music_genre"
  cache_dir: "./cache"
  data_dir: "./data" 
  output_dir: "./outputs"
  target_sample_rate: 22050
  use_simulated_data: true  # Set to false for real CCMusic dataset
  huggingface_token: null   # Add your HF token if needed

augmentation:
  enabled: true
  augmentation_factor: 3
  preserve_original: true
  save_audio: true          # Write augmented audio files
  audio_format: "mp4"       # wav|mp3|mp4 (mp3/mp4 require ffmpeg)
  suppress_warnings: true   # Quiet fallback warnings during augmentation
  
  techniques:
    pitch_shift:
      enabled: true
      probability: 0.8
      range_semitones: [-2, 2]
      preserve_tempo: true
      
    tempo_scale:
      enabled: true
      probability: 0.8
      range_factor: [0.9, 1.1]
      preserve_pitch: true
      
    noise_addition:
      enabled: true
      probability: 0.4
      snr_db_range: [20, 40]
      noise_types: ["gaussian", "uniform", "pink"]
      
    eq_filter:
      enabled: true
      probability: 0.3
      gain_range_db: [-3, 3]
      frequency_ranges:
        low: [60, 250]
        mid: [250, 4000] 
        high: [4000, 8000]
        
    reverb:
      enabled: true
      probability: 0.25
      room_sizes: ["small", "medium", "large"]
      wet_mix_range: [0.1, 0.4]
      decay_time_range: [0.5, 3.0]

text_generation:
  enabled: true
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  prompt_pool_size: 1000
  use_embedding_similarity: true
  cache_dir: "./cache/text_models"

data_organization:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  random_state: 42
  stratify_by_genre: true
  
  segment_durations: [30, 60, 120]  # seconds
  min_song_duration: 60  # seconds
  
structure_processing:
  enabled: true
  structure_subset_size: 300
  create_conditioning_data: true
  
  structure_labels:
    - "intro"
    - "verse" 
    - "chorus"
    - "pre-chorus"
    - "post-chorus"
    - "bridge"
    - "interlude"
    - "ending"
    - "outro"

pipeline:
  save_intermediate_results: true
  continue_on_error: true
  parallel_processing: false
  validation_enabled: true
  
  # Memory management
  batch_size: 32
  max_workers: 4
  
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  save_logs: true
  console_output: true

# Optional: Advanced settings
advanced:
  use_gpu: false
  precision: "float32"
  random_seed: 42
  
  # Validation settings
  validation:
    check_file_integrity: true
    verify_audio_quality: false
    validate_text_prompts: true
    check_structure_coherence: true
